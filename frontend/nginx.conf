server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files, fallback to index.html if needed
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to your backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x-forwarded-for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploads to your backend container
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}