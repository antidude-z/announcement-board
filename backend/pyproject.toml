[project]
name = "announcement-board-backend"
version = "0.1.0"
description = "Private Announcement Board for secure admin-user communication"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "aiogram>=3.13.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "httpx>=0.27"
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8"
]

[tool.importlinter]
root_packages = [
    "main",
    "bot",
    "otp",
    "auth",
    "ports",
    "m2m",
    "hashing",
    "ratelimit",
    "bot_service",
    "integrations",
]

[[tool.importlinter.contracts]]
name = "bot must not know about monolith, otp or auth"
type = "forbidden"
source_modules = ["bot"]
forbidden_modules = ["main", "otp", "auth"]

[[tool.importlinter.contracts]]
name = "otp must not know about monolith, bot or auth"
type = "forbidden"
source_modules = ["otp"]
forbidden_modules = ["main", "bot", "auth"]

[[tool.importlinter.contracts]]
name = "auth must not know about monolith, bot or otp"
type = "forbidden"
source_modules = ["auth"]
forbidden_modules = ["main", "bot", "otp"]

[[tool.importlinter.contracts]]
name = "bot_service must not import monolith, otp or auth"
type = "forbidden"
source_modules = ["bot_service"]
forbidden_modules = ["main", "otp", "auth"]

[[tool.importlinter.contracts]]
name = "monolith must not import bot_service"
type = "forbidden"
source_modules = ["main"]
forbidden_modules = ["bot_service"]

[[tool.importlinter.contracts]]
name = "monolith must not import aiogram (polling lives in bot-service)"
type = "forbidden"
source_modules = ["main"]
forbidden_modules = ["aiogram"]

[[tool.importlinter.contracts]]
name = "backend contexts must not import bot package"
type = "forbidden"
source_modules = [
    "main",
    "auth",
    "otp",
    "integrations",
]
forbidden_modules = [
    "bot",
]