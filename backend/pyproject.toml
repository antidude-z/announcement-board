[project]
name = "announcement-board-backend"
version = "0.1.0"
description = "Private Announcement Board for secure admin-user communication"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "aiogram>=3.13.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
]

[tool.uv]
package = false