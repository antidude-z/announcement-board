[project]
name = "announcement-board-backend"
version = "0.1.0"
description = "Private Announcement Board for secure admin-user communication"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "aiogram>=3.13.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "httpx>=0.27"
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8"
]

[tool.importlinter]
root_packages = ["main", "bot", "otp", "ports", "m2m", "bot_service"]

[[tool.importlinter.contracts]]
name = "bot must not know about monolith or otp"
type = "forbidden"
source_modules = ["bot"]
forbidden_modules = ["main", "otp"]

[[tool.importlinter.contracts]]
name = "otp must not know about monolith or bot"
type = "forbidden"
source_modules = ["otp"]
forbidden_modules = ["main", "bot"]

[[tool.importlinter.contracts]]
name = "bot_service must not import the monolith or otp"
type = "forbidden"
source_modules = ["bot_service"]
forbidden_modules = ["main", "otp"]

[[tool.importlinter.contracts]]
name = "monolith must not import bot_service"
type = "forbidden"
source_modules = ["main"]
forbidden_modules = ["bot_service"]

[[tool.importlinter.contracts]]
name = "monolith must not import aiogram (polling lives in bot-service)"
type = "forbidden"
source_modules = ["main"]
forbidden_modules = ["aiogram"]